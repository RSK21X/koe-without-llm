[package]
name = "koe-core"
description = "Core library for Koe speech recognition"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "koe_core"
crate-type = ["staticlib", "lib"]

[features]
# This build intentionally contains only network ASR providers.  Keeping the
# feature list empty makes local model code impossible to link accidentally.
default = []

[dependencies]
async-trait.workspace = true
koe-asr = { path = "../koe-asr" }
env_logger.workspace = true
futures-util.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]

[build-dependencies]
cbindgen.workspace = true
