name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    # Docs-only pushes skip CI. Tag pushes always run: path filters are
    # bypassed for newly created refs.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "skills/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "skills/**"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test Rust core
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the changelog has a section for this release
        # Fail here, in seconds, rather than after the build:
        # every tagged release should have a corresponding changelog section.
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## ${VERSION}( |$)" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## ${VERSION}' section — add it before tagging."
            exit 1
          fi
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" KoeApp/Koe/Info.plist)
          if [ "$PLIST_VERSION" != "$VERSION" ]; then
            echo "::error file=KoeApp/Koe/Info.plist::CFBundleShortVersionString is ${PLIST_VERSION}, but the tag is ${VERSION}."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: host-tests

      - name: Test Rust core
        run: cargo test --manifest-path koe-core/Cargo.toml

  build-arm64:
    # On tag pushes the build zip is uploaded to the GitHub Release.
    name: Build macOS arm64
    needs: test
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            scheme: Koe
            zip: Koe-macOS-arm64.zip
            artifact: Koe-macOS-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Keep the cache key tied to the single build variant.
          key: aarch64-apple-darwin-${{ matrix.variant }}

      - name: Install dependencies
        # Untap the runner image's untrusted aws/tap first so Homebrew's
        # tap-trust check doesn't emit warnings.
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen cmake
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: KoeApp/build-ci/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-${{ hashFiles('KoeApp/project.yml', 'Packages/**/Package.swift', 'Packages/**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ matrix.variant }}-
            spm-${{ runner.os }}-${{ runner.arch }}-
      - name: Show Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version
      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)

          echo "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"

          echo "CODESIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"

      - name: Build CLI
        run: cargo build --package koe-cli --release --target aarch64-apple-darwin

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: KoeApp

      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild \
            -project Koe.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -configuration Release \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -derivedDataPath "build-ci/${{ matrix.variant }}" \
            -clonedSourcePackagesDirPath build-ci/SourcePackages \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build
        working-directory: KoeApp

      - name: Package app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          .github/scripts/package-app.sh \
            "KoeApp/build-ci/${{ matrix.variant }}/Build/Products/Release/Koe.app" \
            "target/aarch64-apple-darwin/release/koe" \
            "${{ matrix.zip }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.zip }}
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes || true
          fi
          gh release upload "$TAG" "${{ matrix.zip }}" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
